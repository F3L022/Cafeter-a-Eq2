<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Café Central</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-container wide">
    <header class="app-header">
        <div class="logo-area">
            <i class="fa-solid fa-mug-hot"></i>
            <span>CAFÉ CENTRAL - GESTIÓN DE USUARIOS</span>
        </div>
        <button class="btn-secondary" onclick="cerrarSesionLocal()" style="color:white; border-color:white; padding:4px 10px; font-size:0.8rem;">Salir</button>
    </header>

    <main class="app-content">
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px;">
            <!-- DAR DE ALTA -->
            <div style="background: white; padding: 18px; border-radius: 12px; border: 1px solid var(--border-color);">
                <h4 style="background: #2e7d32; color: white; padding: 8px; border-radius: 6px; text-align: center; margin-bottom: 14px;">DAR DE ALTA</h4>
                <form id="formAltaUser">
                    <div class="form-group">
                        <label>Nombre completo:</label>
                        <input type="text" id="altaNombre" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Correo electrónico:</label>
                        <input type="email" id="altaCorreo" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Tipo de usuario:</label>
                        <select id="altaRol" class="form-control" required>
                            <option value="Comprador">Comprador</option>
                            <option value="Dueño de Local">Dueño de Local</option>
                            <option value="Administrador">Administrador</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-green btn-block">GUARDAR USUARIO</button>
                </form>
            </div>

            <!-- DAR DE BAJA / TABLA -->
            <div style="background: white; padding: 18px; border-radius: 12px; border: 1px solid var(--border-color);">
                <h4 style="background: #c62828; color: white; padding: 8px; border-radius: 6px; text-align: center; margin-bottom: 14px;">DAR DE BAJA</h4>
                <div class="table-responsive">
                    <table class="custom-table" id="tablaUsuarios">
                        <thead>
                            <tr>
                                <th>USUARIO</th>
                                <th>TIPO</th>
                                <th>ESTADO</th>
                                <th>ACCIÓN</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>admin@cafecentral.com</td>
                                <td>Administrador</td>
                                <td>Activo</td>
                                <td><button class="btn-red btn-toggle-estado" style="padding: 4px 10px; font-size: 0.75rem;">BAJA</button></td>
                            </tr>
                            <tr>
                                <td>tana@cafecentral.com</td>
                                <td>Dueño de Local</td>
                                <td>Activo</td>
                                <td><button class="btn-red btn-toggle-estado" style="padding: 4px 10px; font-size: 0.75rem;">BAJA</button></td>
                            </tr>
                            <tr>
                                <td>regina@correo.com</td>
                                <td>Comprador</td>
                                <td>Activo</td>
                                <td><button class="btn-red btn-toggle-estado" style="padding: 4px 10px; font-size: 0.75rem;">BAJA</button></td>
                            </tr>
                            <tr>
                                <td>jesus@correo.com</td>
                                <td>Comprador</td>
                                <td>Inactivo</td>
                                <td><button class="btn-green btn-toggle-estado" style="padding: 4px 10px; font-size: 0.75rem;">ALTA</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="mt-4 text-center" style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
            <a href="08_seleccion_usuario.html" class="btn-secondary">← VOLVER</a>
            <a href="19_historial_compras.html" class="btn-secondary"><i class="fa-solid fa-clock-rotate-left"></i> HISTORIAL DE COMPRAS</a>
        </div>
    </main>
</div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="js/app.js"></script>
    
    <script>
$(document).ready(function(){
    $('#formAltaUser').on('submit', function(e){
        e.preventDefault();
        var nom = $('#altaNombre').val();
        var correo = $('#altaCorreo').val();
        var rol = $('#altaRol').val();

        var newRow = '<tr><td>' + correo + '</td><td>' + rol + '</td><td>Activo</td><td><button class="btn-red btn-toggle-estado" style="padding: 4px 10px; font-size: 0.75rem;">BAJA</button></td></tr>';
        $('#tablaUsuarios tbody').append(newRow);
        alert('Usuario ' + nom + ' dado de alta exitosamente.');
        this.reset();
    });

    $(document).on('click', '.btn-toggle-estado', function(){
        var $btn = $(this);
        var $tdEstado = $btn.closest('tr').find('td').eq(2);
        if($btn.hasClass('btn-red')){
            $btn.removeClass('btn-red').addClass('btn-green').text('ALTA');
            $tdEstado.text('Inactivo');
        } else {
            $btn.removeClass('btn-green').addClass('btn-red').text('BAJA');
            $tdEstado.text('Activo');
        }
    });
});
</script>
</body>
</html>
