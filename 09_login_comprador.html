<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión Comprador - Café Central</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div class="logo-area">
            <i class="fa-solid fa-mug-hot"></i>
            <span>CAFÉ CENTRAL</span>
        </div>
        <button class="nav-toggle" id="navToggle"><i class="fa-solid fa-bars"></i></button>
    </header>

    <main class="app-content">
        <div class="text-center mb-4">
            <i class="fa-regular fa-user" style="font-size: 2.2rem; color: var(--primary-brown);"></i>
            <h2 style="color: var(--primary-brown); margin-top: 5px;">INICIAR SESIÓN</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Acceso para Compradores</p>
        </div>

        <form id="formLoginComprador">
            <div class="form-group">
                <label>Correo electrónico:</label>
                <input type="email" name="correo" class="form-control" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="recordarC">
                <label for="recordarC" style="margin: 0; font-weight: normal; font-size: 0.85rem;">Recordarme</label>
            </div>
            <button type="submit" class="btn-primary btn-block">INICIAR SESIÓN</button>
        </form>

        <div class="text-center mt-3">
            <a href="#" style="font-size: 0.8rem; color: var(--text-muted); text-decoration: underline;">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="mt-4">
            <a href="08_seleccion_usuario.html" class="btn-secondary btn-block">← VOLVER</a>
        </div>
    </main>
</div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
    <script>
$(document).ready(function(){
    validarLogin('formLoginComprador', 'Comprador');
});
</script>
</body>
</html>
