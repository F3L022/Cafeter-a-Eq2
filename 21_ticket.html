<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket de Compra - Café Central</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .ticket {
            background: #fff; max-width: 360px; margin: 0 auto; padding: 22px 20px;
            border: 1px dashed var(--border-color); border-radius: 10px;
            font-family: 'Courier New', monospace; font-size: 0.9rem; color: #222;
        }
        .ticket h3 { text-align: center; margin-bottom: 2px; font-family: inherit; }
        .ticket .centro { text-align: center; }
        .ticket .linea { border-top: 1px dashed #999; margin: 10px 0; }
        .ticket .fila { display: flex; justify-content: space-between; gap: 10px; }
        .ticket .total { font-weight: 700; font-size: 1.05rem; }
        .aviso-nuevo { background: #e8f5e9; color: #1b5e20; padding: 12px; border-radius: 10px; text-align: center; margin-bottom: 16px; font-weight: 700; }
        @media print {
            .app-header, .mobile-nav, .no-imprimir { display: none !important; }
            body, .app-container { background: #fff !important; box-shadow: none !important; }
            .ticket { border: none; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div class="logo-area">
            <i class="fa-solid fa-receipt"></i>
            <span>CAFÉ CENTRAL - TICKET</span>
        </div>
        <button class="nav-toggle" id="navToggle"><i class="fa-solid fa-bars"></i></button>
    </header>

    <main class="app-content">
        <div id="avisoNuevo" class="aviso-nuevo no-imprimir" style="display:none;">
            <i class="fa-solid fa-circle-check"></i> ¡Tu pedido fue enviado al local! Ya aparece en tu historial de compras.
        </div>

        <div class="ticket" id="ticket"></div>

        <div class="mt-4 no-imprimir" style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
            <button class="btn-primary" onclick="window.print()"><i class="fa-solid fa-print"></i> IMPRIMIR</button>
            <a href="19_historial_compras.html" class="btn-secondary"><i class="fa-solid fa-clock-rotate-left"></i> HISTORIAL</a>
            <a href="02_menu_principal.html" class="btn-secondary" id="btnVolverTicket">← VOLVER</a>
        </div>
    </main>
</div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/pedidos.js"></script>
    <script>
$(document).ready(function(){
    var usr = obtenerUsuarioActual();
    if (!usr) {
        alert('Debes iniciar sesión para ver el ticket.');
        window.location.href = '08_seleccion_usuario.html';
        return;
    }
    if (usr.rol === 'Dueño de Local') $('#btnVolverTicket').attr('href', '16_pedidos_local.html').text('← VOLVER A PEDIDOS');
    if (usr.rol === 'Administrador') $('#btnVolverTicket').attr('href', '19_historial_compras.html').text('← VOLVER');

    var params = new URLSearchParams(window.location.search);
    var idPedido = params.get('id');
    if (params.get('nuevo') === '1') $('#avisoNuevo').show();

    function telefonoBonito(t){
        t = String(t || '');
        return t.length === 10 ? t.slice(0, 3) + ' ' + t.slice(3, 6) + ' ' + t.slice(6) : t;
    }

    function dibujarTicket(p){
        var subtotal = p.total / 1.16;
        var html = '<h3>☕ CAFÉ CENTRAL</h3>' +
            '<div class="centro">' + esc(p.sucursal) + '<br>' + esc(p.sucursal_direccion) + '<br>Tel. ' + esc(telefonoBonito(p.sucursal_telefono)) + '</div>' +
            '<div class="linea"></div>' +
            '<div class="fila"><span>TICKET:</span><span>#' + p.id + '</span></div>' +
            '<div class="fila"><span>FECHA:</span><span>' + formatoFecha(p.fecha) + '</span></div>' +
            '<div class="fila"><span>CLIENTE:</span><span>' + esc(p.cliente) + '</span></div>' +
            '<div class="fila"><span>PAGO:</span><span>' + esc(p.pago || 'Efectivo') + '</span></div>' +
            '<div class="fila"><span>ESTADO:</span><span>' + badgeEstado(p.estado) + '</span></div>' +
            '<div class="linea"></div>';
        for (var i = 0; i < p.items.length; i++) {
            var it = p.items[i];
            html += '<div class="fila"><span>' + it.cantidad + ' x ' + esc(it.nombre) + '</span><span>' + formatoDinero(it.precio * it.cantidad) + '</span></div>' +
                '<div style="font-size:0.75rem; color:#777; margin-bottom:4px;">&nbsp;&nbsp;' + formatoDinero(it.precio) + ' c/u</div>';
        }
        html += '<div class="linea"></div>' +
            '<div class="fila"><span>SUBTOTAL</span><span>' + formatoDinero(subtotal) + '</span></div>' +
            '<div class="fila"><span>IVA (16%)</span><span>' + formatoDinero(p.total - subtotal) + '</span></div>' +
            '<div class="fila total"><span>TOTAL</span><span>' + formatoDinero(p.total) + '</span></div>';
        if (p.notas) html += '<div class="linea"></div><div>NOTAS: ' + esc(p.notas) + '</div>';
        html += '<div class="linea"></div><div class="centro">¡Gracias por tu compra!<br>Conserva este ticket.</div>';
        $('#ticket').html(html);
    }

    // El backend solo regresa el pedido si le pertenece al usuario (o es dueño/admin)
    function cargarTicket(){
        return buscarPedido(idPedido).then(dibujarTicket).catch(function(){
            $('#ticket').html('<p class="centro">No se encontró el ticket solicitado.</p>');
            clearInterval(timer);
        });
    }
    var timer = setInterval(cargarTicket, 15000); // si el dueño cambia el estado, se actualiza
    cargarTicket();
});
</script>
</body>
</html>
