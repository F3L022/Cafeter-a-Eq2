<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Tipo de Usuario - Café Central</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div class="logo-area">
            <i class="fa-solid fa-mug-hot"></i>
            <span>CAFÉ CENTRAL</span>
        </div>
        <button class="nav-toggle" id="navToggle"><i class="fa-solid fa-bars"></i></button>
    </header>

    <main class="app-content text-center">
        <i class="fa-regular fa-user" style="font-size: 2.5rem; color: var(--primary-brown); margin-bottom: 10px;"></i>
        <h2 class="mb-4" style="color: var(--primary-brown);">¿CÓMO DESEAS INGRESAR?</h2>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <a href="09_login_comprador.html" class="menu-card" style="flex-direction: column; text-align: center; padding: 20px 10px;">
                <i class="fa-solid fa-cart-shopping" style="font-size: 1.8rem; margin-bottom: 8px; color: var(--primary-brown);"></i>
                <div style="font-weight: 700;">COMPRADOR</div>
                <small style="font-size: 0.75rem; color: var(--text-muted); font-weight: normal; margin-top: 4px;">Realiza compras y disfruta nuestros productos</small>
            </a>

            <a href="12_login_dueno.html" class="menu-card" style="flex-direction: column; text-align: center; padding: 20px 10px;">
                <i class="fa-solid fa-store" style="font-size: 1.8rem; margin-bottom: 8px; color: var(--primary-brown);"></i>
                <div style="font-weight: 700;">DUEÑO DE LOCAL</div>
                <small style="font-size: 0.75rem; color: var(--text-muted); font-weight: normal; margin-top: 4px;">Administra tu local, productos y pedidos</small>
            </a>
        </div>

        <a href="10_login_admin.html" class="menu-card" style="padding: 16px;">
            <div class="left-icon">
                <i class="fa-solid fa-shield-halved" style="font-size: 1.5rem;"></i>
                <div style="text-align: left;">
                    <div style="font-weight: 700;">ADMINISTRADOR</div>
                    <small style="font-size: 0.75rem; color: var(--text-muted); font-weight: normal;">Gestiona usuarios y el sistema de la aplicación</small>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right"></i>
        </a>
    </main>
</div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="js/app.js"></script>
    
</body>
</html>
