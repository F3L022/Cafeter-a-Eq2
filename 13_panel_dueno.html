<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Dueño de Local - Café Central</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div class="logo-area">
            <i class="fa-solid fa-store"></i>
            <span>MI LOCAL</span>
        </div>
        <i class="fa-solid fa-right-left" style="color: white; cursor: pointer;" onclick="window.location.href='08_seleccion_usuario.html'"></i>
    </header>

    <main class="app-content text-center">
        <h2 style="color: var(--primary-brown);">MI LOCAL</h2>
        <p style="font-weight: 700; margin-top: 4px;">¡Bienvenido a tu local!</p>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">Desde aquí puedes administrar todo lo relacionado con tu cafetería.</p>

        <div class="menu-list">
            <a href="14_admin_productos.html" class="menu-card">
                <div class="left-icon"><i class="fa-solid fa-coffee"></i> PRODUCTOS</div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
            <a href="15_listado_inventario.html" class="menu-card">
                <div class="left-icon"><i class="fa-solid fa-boxes-stacked"></i> INVENTARIO</div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
            <a href="16_pedidos_local.html" class="menu-card">
                <div class="left-icon"><i class="fa-solid fa-receipt"></i> PEDIDOS</div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
            <a href="20_carrito.html" class="menu-card">
                <div class="left-icon"><i class="fa-solid fa-cart-shopping"></i> CARRITOS DE CLIENTES</div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
            <a href="19_historial_compras.html" class="menu-card">
                <div class="left-icon"><i class="fa-solid fa-clock-rotate-left"></i> HISTORIAL DE COMPRAS</div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
            <a href="17_configuracion_local.html" class="menu-card">
                <div class="left-icon"><i class="fa-solid fa-gear"></i> MI INFORMACIÓN</div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>

        <div class="mt-4">
            <button onclick="cerrarSesionLocal()" class="btn-primary btn-block">← CERRAR SESIÓN</button>
        </div>
    </main>
</div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="js/app.js"></script>
    
</body>
</html>
