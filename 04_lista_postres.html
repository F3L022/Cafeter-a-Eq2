<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Postres - Café Central</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div class="logo-area">
            <i class="fa-solid fa-mug-hot"></i>
            <span>CAFÉ CENTRAL</span>
        </div>
        <button class="nav-toggle" id="navToggle"><i class="fa-solid fa-bars"></i></button>
    </header>

    <main class="app-content">
        <h2 class="text-center mb-4" style="color: var(--primary-brown);">POSTRES <i class="fa-solid fa-cake-candles"></i></h2>
        
        <div class="product-card">
            <div class="product-info">
                <img src="img/cheesecake.jpg" alt="Cheesecake" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=100'">
                <div class="product-details">
                    <h4>CHEESECAKE</h4>
                    <div class="price">$65</div>
                </div>
            </div>
            <button class="btn-primary btn-ordenar">COMPRAR</button>
        </div>

        <div class="product-card">
            <div class="product-info">
                <img src="img/brownie.jpg" alt="Brownie" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=100'">
                <div class="product-details">
                    <h4>BROWNIE</h4>
                    <div class="price">$50</div>
                </div>
            </div>
            <button class="btn-primary btn-ordenar">COMPRAR</button>
        </div>

        <div class="product-card">
            <div class="product-info">
                <img src="img/pastel.jpg" alt="Pastel" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=100'">
                <div class="product-details">
                    <h4>PASTEL</h4>
                    <div class="price">$60</div>
                </div>
            </div>
            <button class="btn-primary btn-ordenar">COMPRAR</button>
        </div>

        <div class="product-card">
            <div class="product-info">
                <img src="img/galletas.jpg" alt="Galletas" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1499636136210-6f4ee915583e?w=100'">
                <div class="product-details">
                    <h4>GALLETAS</h4>
                    <div class="price">$35</div>
                </div>
            </div>
            <button class="btn-primary btn-ordenar">COMPRAR</button>
        </div>

        <div class="mt-4">
            <a href="02_menu_principal.html" class="btn-secondary btn-block">← VOLVER AL MENÚ</a>
        </div>
    </main>
</div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="js/app.js"></script>
    
    <script src="js/productos.js"></script>
    <script src="js/pedidos.js"></script>
    <script>$(function(){ actualizarPrecios(); activarOrdenar(); });</script>
</body>
</html>
