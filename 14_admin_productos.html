<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador de Productos - Café Central</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-container wide">
    <header class="app-header">
        <div class="logo-area">
            <i class="fa-solid fa-mug-hot"></i>
            <span>CAFÉ CENTRAL - MIS PRODUCTOS</span>
        </div>
        <button class="nav-toggle" id="navToggle"><i class="fa-solid fa-bars"></i></button>
    </header>

    <main class="app-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
            <h2 style="color: var(--primary-brown);">MIS PRODUCTOS</h2>
            <button class="btn-green" id="btnAgregarProducto"><i class="fa-solid fa-plus"></i> AGREGAR PRODUCTO</button>
        </div>

        <div class="table-responsive">
            <table class="custom-table" id="tablaProductos">
                <thead>
                    <tr>
                        <th>PRODUCTO</th>
                        <th>PRECIO</th>
                        <th>CATEGORÍA</th>
                        <th>ACCIÓN</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="text-center mt-3">
            <a href="13_panel_dueno.html" class="btn-secondary">← VOLVER</a>
        </div>
    </main>
</div>

<!-- Modal Agregar/Editar Producto -->
<div class="modal-overlay" id="modalProducto">
    <div class="modal-content">
        <h3 class="text-center mb-3" style="color: var(--primary-brown);" id="modalProdTitle">Nuevo Producto</h3>
        <form id="formProducto">
            <div class="form-group">
                <label>Nombre del Producto:</label>
                <input type="text" id="prodNombre" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Precio ($):</label>
                <input type="number" step="0.5" id="prodPrecio" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Categoría:</label>
                <select id="prodCategoria" class="form-control" required>
                    <option value="Cafés">Cafés</option>
                    <option value="Postres">Postres</option>
                    <option value="Bebidas">Bebidas</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button type="submit" class="btn-green btn-block">Guardar</button>
                <button type="button" class="btn-red btn-block" id="btnCerrarModal">Cancelar</button>
            </div>
        </form>
    </div>
</div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="js/app.js"></script>
    
    <script src="js/productos.js"></script>
    <script>
$(document).ready(function(){
    var usr = obtenerUsuarioActual();
    if (!usr || (usr.rol !== 'Dueño de Local' && usr.rol !== 'Administrador')) {
        alert('Debes iniciar sesión como Dueño de Local.');
        window.location.href = '12_login_dueno.html';
        return;
    }

    var productos = [];
    var idEditando = null;

    // Las categorías del select salen de la BD
    api('GET', '/api/categorias').then(function(cats){
        var ops = '';
        for (var i = 0; i < cats.length; i++) ops += '<option value="' + esc(cats[i].nombre) + '">' + esc(cats[i].nombre) + '</option>';
        $('#prodCategoria').html(ops);
    }).catch(mostrarError);

    function dibujarTabla(){
        api('GET', '/api/productos/mios').then(function(lista){
            productos = lista;
            var filas = '';
            for (var i = 0; i < lista.length; i++) {
                filas += '<tr data-id="' + lista[i].id + '"><td>' + esc(lista[i].nombre) + '</td><td>' + formatoDinero(lista[i].precio) + '</td><td>' + esc(lista[i].categoria) + '</td>' +
                    '<td><i class="fa-solid fa-pen-to-square btn-edit" style="color:#0d6efd; cursor:pointer; margin-right:10px;"></i>' +
                    '<i class="fa-solid fa-trash btn-delete" style="color:#dc3545; cursor:pointer;"></i></td></tr>';
            }
            if (!filas) filas = '<tr><td colspan="4" class="text-center" style="color: var(--text-muted);">Aún no tienes productos.</td></tr>';
            $('#tablaProductos tbody').html(filas);
        }).catch(mostrarError);
    }

    function productoDeFila($el){
        var id = $el.closest('tr').data('id');
        for (var i = 0; i < productos.length; i++) if (productos[i].id == id) return productos[i];
        return null;
    }

    $('#btnAgregarProducto').click(function(){
        idEditando = null;
        $('#modalProdTitle').text('Nuevo Producto');
        $('#formProducto')[0].reset();
        $('#modalProducto').css('display', 'flex');
    });

    $(document).on('click', '.btn-edit', function(){
        var p = productoDeFila($(this));
        if (!p) return;
        idEditando = p.id;
        $('#modalProdTitle').text('Editar Producto');
        $('#prodNombre').val(p.nombre);
        $('#prodPrecio').val(p.precio);
        $('#prodCategoria').val(p.categoria);
        $('#modalProducto').css('display', 'flex');
    });

    $('#btnCerrarModal').click(function(){
        $('#modalProducto').hide();
    });

    $(document).on('click', '.btn-delete', function(){
        var p = productoDeFila($(this));
        if (p && confirm('¿Deseas eliminar "' + p.nombre + '" del catálogo?')) {
            api('DELETE', '/api/productos/' + p.id).then(dibujarTabla).catch(mostrarError);
        }
    });

    $('#formProducto').submit(function(e){
        e.preventDefault();
        var precio = parseFloat($('#prodPrecio').val());
        if (isNaN(precio) || precio < 0) {
            alert('El precio no puede ser negativo.');
            return;
        }
        var producto = { nombre: $('#prodNombre').val().trim(), precio: precio, categoria: $('#prodCategoria').val() };
        var peticion = idEditando ? api('PUT', '/api/productos/' + idEditando, producto) : api('POST', '/api/productos', producto);
        peticion.then(function(){
            $('#modalProducto').hide();
            dibujarTabla();
        }).catch(mostrarError);
    });

    dibujarTabla();
});
</script>
</body>
</html>
