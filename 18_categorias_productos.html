<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías de Productos - Café Central</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-container wide">
    <header class="app-header">
        <div class="logo-area">
            <i class="fa-solid fa-layer-group"></i>
            <span>CAFÉ CENTRAL - CATEGORÍAS</span>
        </div>
        <button class="nav-toggle" id="navToggle"><i class="fa-solid fa-bars"></i></button>
    </header>

    <main class="app-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
            <h2 style="color: var(--primary-brown);">CATEGORÍAS DE PRODUCTOS</h2>
            <button class="btn-green" id="btnNuevaCat">+ NUEVA CATEGORÍA</button>
        </div>

        <div class="table-responsive">
            <table class="custom-table" id="tablaCategorias">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>NOMBRE DE CATEGORÍA</th>
                        <th>DESCRIPCIÓN</th>
                        <th>ACCIONES</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="4" class="text-center">Cargando...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="text-center mt-3">
            <a href="13_panel_dueno.html" class="btn-secondary">← VOLVER</a>
        </div>
    </main>
</div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="js/app.js"></script>
    
    <script>
$(document).ready(function(){
    var usr = obtenerUsuarioActual();
    if (!usr || (usr.rol !== 'Dueño de Local' && usr.rol !== 'Administrador')) {
        alert('Debes iniciar sesión como Dueño de Local.');
        window.location.href = '12_login_dueno.html';
        return;
    }

    var categorias = [];

    function dibujarCategorias(){
        api('GET', '/api/categorias').then(function(lista){
            categorias = lista;
            var filas = '';
            for (var i = 0; i < lista.length; i++) {
                var c = lista[i];
                filas += '<tr data-id="' + c.id + '"><td>' + c.id + '</td><td>' + esc(c.nombre) + '</td><td>' + esc(c.descripcion || '') + '</td>' +
                    '<td><i class="fa-solid fa-pen-to-square btn-edit" style="color:#0d6efd; cursor:pointer; margin-right:10px;"></i>' +
                    '<i class="fa-solid fa-trash btn-delete" style="color:#dc3545; cursor:pointer;"></i></td></tr>';
            }
            $('#tablaCategorias tbody').html(filas);
        }).catch(mostrarError);
    }

    function categoriaDeFila($el){
        var id = $el.closest('tr').data('id');
        for (var i = 0; i < categorias.length; i++) if (categorias[i].id == id) return categorias[i];
        return null;
    }

    $('#btnNuevaCat').click(function(){
        var nombre = prompt('Ingresa el nombre de la nueva categoría:');
        if (!nombre) return;
        var desc = prompt('Ingresa la descripción:') || '';
        api('POST', '/api/categorias', { nombre: nombre, descripcion: desc }).then(dibujarCategorias).catch(mostrarError);
    });

    $(document).on('click', '.btn-edit', function(){
        var c = categoriaDeFila($(this));
        if (!c) return;
        var nombre = prompt('Nombre de la categoría:', c.nombre);
        if (!nombre) return;
        var desc = prompt('Descripción:', c.descripcion || '');
        if (desc === null) return;
        api('PUT', '/api/categorias/' + c.id, { nombre: nombre, descripcion: desc }).then(dibujarCategorias).catch(mostrarError);
    });

    $(document).on('click', '.btn-delete', function(){
        var c = categoriaDeFila($(this));
        if (c && confirm('¿Eliminar la categoría "' + c.nombre + '"?')) {
            api('DELETE', '/api/categorias/' + c.id).then(dibujarCategorias).catch(mostrarError);
        }
    });

    dibujarCategorias();
});
</script>
</body>
</html>
