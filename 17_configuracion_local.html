<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración del Local - Café Central</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div class="logo-area">
            <i class="fa-solid fa-gear"></i>
            <span>CONFIGURACIÓN DEL LOCAL</span>
        </div>
        <button class="nav-toggle" id="navToggle"><i class="fa-solid fa-bars"></i></button>
    </header>

    <main class="app-content">
        <form id="formConfigLocal">
            <div class="form-group">
                <label>Nombre del local:</label>
                <input type="text" class="form-control" value="Café Central - Sucursal Centro">
            </div>
            <div class="form-group">
                <label>Dirección:</label>
                <input type="text" class="form-control" value="Av. Café #123, Centro">
            </div>
            <div class="form-group">
                <label>Teléfono:</label>
                <input type="text" class="form-control" value="81 1234 5678">
            </div>
            <div class="form-group">
                <label>Descripción:</label>
                <textarea class="form-control" rows="3">La mejor experiencia en café.</textarea>
            </div>

            <button type="submit" class="btn-green btn-block mb-3">GUARDAR CAMBIOS</button>
            <a href="13_panel_dueno.html" class="btn-secondary btn-block">← VOLVER</a>
        </form>
    </main>
</div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="js/app.js"></script>
    
    <script>
$(document).ready(function(){
    $('#formConfigLocal').submit(function(e){
        e.preventDefault();
        alert('¡Configuración de la sucursal actualizada correctamente!');
    });
});
</script>
</body>
</html>
