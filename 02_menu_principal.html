<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - Café Central</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div class="logo-area">
            <i class="fa-solid fa-mug-hot"></i>
            <span>CAFÉ CENTRAL</span>
        </div>
        <button class="nav-toggle" id="navToggle"><i class="fa-solid fa-bars"></i></button>
    </header>

    <main class="app-content">
        <h2 class="text-center mb-4" style="color: var(--primary-brown);">NUESTRO MENÚ</h2>
        
        <div style="display: flex; gap: 15px;">
            <div style="width: 35%; flex-shrink: 0;">
                <div class="menu-list">
                    <a href="03_lista_cafes.html" class="menu-card" style="background: var(--primary-brown); color: white;">CAFÉS</a>
                    <a href="04_lista_postres.html" class="menu-card">POSTRES</a>
                    <a href="05_lista_bebidas.html" class="menu-card">BEBIDAS</a>
                    <a href="20_carrito.html" class="menu-card"><i class="fa-solid fa-cart-shopping"></i>&nbsp;CARRITO</a>
                    <a href="19_historial_compras.html" class="menu-card"><i class="fa-solid fa-receipt"></i>&nbsp;MIS PEDIDOS</a>
                    <a href="06_sobre_nosotros.html" class="menu-card">NOSOTROS</a>
                    <a href="07_contactanos.html" class="menu-card">CONTACTO</a>
                </div>
            </div>

            <div style="flex: 1;">
                <div class="product-card">
                    <div class="product-info">
                        <img src="img/latte.jpg" alt="Latte" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1541167760496-1628856ab772?w=100'">
                        <div class="product-details">
                            <h4>LATTE</h4>
                            <div class="price">$65</div>
                        </div>
                    </div>
                    <a href="03_lista_cafes.html" class="btn-primary" style="padding: 6px 14px; font-size: 0.85rem;">VER MÁS</a>
                </div>

                <div class="product-card">
                    <div class="product-info">
                        <img src="img/frappe.jpg" alt="Frappé" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=100'">
                        <div class="product-details">
                            <h4>FRAPPÉ</h4>
                            <div class="price">$75</div>
                        </div>
                    </div>
                    <a href="03_lista_cafes.html" class="btn-primary" style="padding: 6px 14px; font-size: 0.85rem;">VER MÁS</a>
                </div>

                <div class="product-card">
                    <div class="product-info">
                        <img src="img/mocha.jpg" alt="Mocha" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1578314675249-a6910f80cc4e?w=100'">
                        <div class="product-details">
                            <h4>MOCHA</h4>
                            <div class="price">$70</div>
                        </div>
                    </div>
                    <a href="03_lista_cafes.html" class="btn-primary" style="padding: 6px 14px; font-size: 0.85rem;">VER MÁS</a>
                </div>
            </div>
        </div>
        <div class="text-center mt-3" style="font-size: 0.8rem; color: var(--text-muted);">
            » DISFRUTA NUESTRAS ESPECIALIDADES «
        </div>
    </main>
</div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="js/app.js"></script>
    
    <script src="js/productos.js"></script>
    <script>$(function(){ actualizarPrecios(); });</script>
</body>
</html>
