<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Café Central</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-container wide">
    <header class="app-header">
        <div class="logo-area">
            <i class="fa-solid fa-mug-hot"></i>
            <span>CAFÉ CENTRAL - GESTIÓN DE USUARIOS</span>
        </div>
        <button class="btn-secondary" onclick="cerrarSesionLocal()" style="color:white; border-color:white; padding:4px 10px; font-size:0.8rem;">Salir</button>
    </header>

    <main class="app-content">
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px;">
            <!-- DAR DE ALTA -->
            <div style="background: white; padding: 18px; border-radius: 12px; border: 1px solid var(--border-color);">
                <h4 style="background: #2e7d32; color: white; padding: 8px; border-radius: 6px; text-align: center; margin-bottom: 14px;">DAR DE ALTA</h4>
                <form id="formAltaUser">
                    <div class="form-group">
                        <label>Nombre completo:</label>
                        <input type="text" id="altaNombre" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Correo electrónico:</label>
                        <input type="email" id="altaCorreo" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña:</label>
                        <input type="password" id="altaContrasena" class="form-control" minlength="4" required>
                    </div>
                    <div class="form-group">
                        <label>Tipo de usuario:</label>
                        <select id="altaRol" class="form-control" required>
                            <option value="Comprador">Comprador</option>
                            <option value="Dueño de Local">Dueño de Local</option>
                            <option value="Administrador">Administrador</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-green btn-block">GUARDAR USUARIO</button>
                </form>
            </div>

            <!-- DAR DE BAJA / TABLA -->
            <div style="background: white; padding: 18px; border-radius: 12px; border: 1px solid var(--border-color);">
                <h4 style="background: #c62828; color: white; padding: 8px; border-radius: 6px; text-align: center; margin-bottom: 14px;">DAR DE BAJA</h4>
                <div class="table-responsive">
                    <table class="custom-table" id="tablaUsuarios">
                        <thead>
                            <tr>
                                <th>USUARIO</th>
                                <th>TIPO</th>
                                <th>ESTADO</th>
                                <th>ACCIÓN</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="4" class="text-center">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="mt-4 text-center" style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
            <a href="08_seleccion_usuario.html" class="btn-secondary">← VOLVER</a>
            <a href="19_historial_compras.html" class="btn-secondary"><i class="fa-solid fa-clock-rotate-left"></i> HISTORIAL DE COMPRAS</a>
        </div>
    </main>
</div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="js/app.js"></script>
    
    <script>
$(document).ready(function(){
    var usr = obtenerUsuarioActual();
    if (!usr || usr.rol !== 'Administrador') {
        alert('Debes iniciar sesión como Administrador.');
        window.location.href = '10_login_admin.html';
        return;
    }

    function dibujarUsuarios(){
        api('GET', '/api/usuarios').then(function(lista){
            var filas = '';
            for (var i = 0; i < lista.length; i++) {
                var u = lista[i];
                filas += '<tr data-id="' + u.id + '" data-activo="' + (u.activo ? 1 : 0) + '">' +
                    '<td>' + esc(u.correo) + '<br><small style="color:var(--text-muted);">' + esc(u.nombre) + '</small></td>' +
                    '<td>' + esc(u.rol) + '</td><td>' + (u.activo ? 'Activo' : 'Inactivo') + '</td>' +
                    '<td>' + (u.yo
                        ? '<small style="color:var(--text-muted);">(tú)</small>'
                        : '<button class="' + (u.activo ? 'btn-red' : 'btn-green') + ' btn-toggle-estado" style="padding: 4px 10px; font-size: 0.75rem;">' +
                          (u.activo ? 'BAJA' : 'ALTA') + '</button>') + '</td></tr>';
            }
            $('#tablaUsuarios tbody').html(filas);
        }).catch(mostrarError);
    }

    $('#formAltaUser').on('submit', function(e){
        e.preventDefault();
        var form = this;
        var datos = {
            nombre: $('#altaNombre').val().trim(),
            correo: $('#altaCorreo').val().trim(),
            rol: $('#altaRol').val(),
            contrasena: $('#altaContrasena').val()
        };
        api('POST', '/api/usuarios', datos).then(function(){
            alert('Usuario ' + datos.nombre + ' dado de alta exitosamente.');
            form.reset();
            dibujarUsuarios();
        }).catch(mostrarError);
    });

    $(document).on('click', '.btn-toggle-estado', function(){
        var $tr = $(this).closest('tr');
        var activar = $tr.data('activo') != 1;
        api('PATCH', '/api/usuarios/' + $tr.data('id') + '/estado', { activo: activar })
            .then(dibujarUsuarios)
            .catch(mostrarError);
    });

    dibujarUsuarios();
});
</script>
</body>
</html>
