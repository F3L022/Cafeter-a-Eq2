<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestros Cafés - Café Central</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div class="logo-area">
            <i class="fa-solid fa-mug-hot"></i>
            <span>CAFÉ CENTRAL</span>
        </div>
        <button class="nav-toggle" id="navToggle"><i class="fa-solid fa-bars"></i></button>
    </header>

    <main class="app-content">
        <h2 class="text-center mb-4" style="color: var(--primary-brown);">NUESTROS CAFÉS <i class="fa-solid fa-mug-saucer"></i></h2>
        
        <div class="product-card">
            <div class="product-info">
                <img src="img/americano.jpg" alt="Americano" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=100'">
                <div class="product-details">
                    <h4>AMERICANO</h4>
                    <div class="price">$45</div>
                </div>
            </div>
            <button class="btn-primary btn-ordenar">ORDENAR</button>
        </div>

        <div class="product-card">
            <div class="product-info">
                <img src="img/cappuccino.jpg" alt="Cappuccino" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=100'">
                <div class="product-details">
                    <h4>CAPPUCCINO</h4>
                    <div class="price">$60</div>
                </div>
            </div>
            <button class="btn-primary btn-ordenar">ORDENAR</button>
        </div>

        <div class="product-card">
            <div class="product-info">
                <img src="img/latte.jpg" alt="Latte" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1541167760496-1628856ab772?w=100'">
                <div class="product-details">
                    <h4>LATTE</h4>
                    <div class="price">$65</div>
                </div>
            </div>
            <button class="btn-primary btn-ordenar">ORDENAR</button>
        </div>

        <div class="product-card">
            <div class="product-info">
                <img src="img/frappe.jpg" alt="Frappé" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=100'">
                <div class="product-details">
                    <h4>FRAPPÉ</h4>
                    <div class="price">$70</div>
                </div>
            </div>
            <button class="btn-primary btn-ordenar">ORDENAR</button>
        </div>

        <div class="mt-4">
            <a href="02_menu_principal.html" class="btn-secondary btn-block">← VOLVER AL MENÚ</a>
        </div>
    </main>
</div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="js/app.js"></script>
    
    <script src="js/productos.js"></script>
    <script src="js/pedidos.js"></script>
    <script>$(function(){ actualizarPrecios(); activarOrdenar(); });</script>
</body>
</html>
