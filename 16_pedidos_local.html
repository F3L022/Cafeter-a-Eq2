<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos del Local - Café Central</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-container wide">
    <header class="app-header">
        <div class="logo-area">
            <i class="fa-solid fa-receipt"></i>
            <span>PEDIDOS RECIBIDOS</span>
        </div>
        <button class="nav-toggle" id="navToggle"><i class="fa-solid fa-bars"></i></button>
    </header>

    <main class="app-content">
        <h2 class="text-center mb-4" style="color: var(--primary-brown);">PEDIDOS DEL LOCAL <i class="fa-solid fa-receipt"></i></h2>

        <div class="filtros-pedidos">
            <input type="text" id="buscarPedido" class="form-control" placeholder="Buscar por cliente o # de pedido...">
            <select id="filtroEstado" class="form-control">
                <option value="activos">Activos (Pendiente / En preparación)</option>
                <option value="">Todos</option>
                <option value="Pendiente">Pendiente</option>
                <option value="En preparación">En preparación</option>
                <option value="Entregado">Entregado</option>
                <option value="Cancelado">Cancelado</option>
            </select>
        </div>

        <p id="resumenPedidos" style="font-size:0.85rem; color: var(--text-muted); margin-bottom:10px;"></p>

        <div class="table-responsive">
            <table class="custom-table" id="tablaPedidos">
                <thead>
                    <tr>
                        <th>PEDIDO</th>
                        <th>CLIENTE</th>
                        <th>FECHA</th>
                        <th>TOTAL</th>
                        <th>ESTADO</th>
                        <th>CAMBIAR ESTADO</th>
                        <th>ACCIÓN</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="text-center mt-3" style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
            <a href="13_panel_dueno.html" class="btn-secondary">← VOLVER</a>
            <a href="19_historial_compras.html" class="btn-secondary"><i class="fa-solid fa-clock-rotate-left"></i> HISTORIAL DE COMPRAS</a>
        </div>
    </main>
</div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/pedidos.js"></script>
    <script>
$(document).ready(function(){
    var usr = obtenerUsuarioActual();
    if (!usr || (usr.rol !== 'Dueño de Local' && usr.rol !== 'Administrador')) {
        alert('Debes iniciar sesión como Dueño de Local para ver los pedidos.');
        window.location.href = '12_login_dueno.html';
        return;
    }

    function dibujarPedidos(){
        var filtro = $('#filtroEstado').val();
        var texto = $('#buscarPedido').val().toLowerCase();
        var lista = leerPedidos().slice().sort(function(a, b){ return b.id - a.id; });
        var filas = '';
        var pendientes = 0, preparacion = 0;
        for (var i = 0; i < lista.length; i++) {
            var p = lista[i];
            if (p.estado === 'Pendiente') pendientes++;
            if (p.estado === 'En preparación') preparacion++;
            if (filtro === 'activos' && p.estado !== 'Pendiente' && p.estado !== 'En preparación') continue;
            if (filtro && filtro !== 'activos' && p.estado !== filtro) continue;
            if (texto && (('#' + p.id + ' ' + p.cliente).toLowerCase().indexOf(texto) === -1)) continue;

            var opciones = '';
            for (var j = 0; j < ESTADOS_PEDIDO.length; j++) {
                opciones += '<option value="' + ESTADOS_PEDIDO[j] + '"' + (ESTADOS_PEDIDO[j] === p.estado ? ' selected' : '') + '>' + ESTADOS_PEDIDO[j] + '</option>';
            }
            filas += '<tr data-id="' + p.id + '"><td>#' + p.id + '</td><td>' + p.cliente + '</td><td>' + formatoFecha(p.fecha) + '</td>' +
                '<td>' + formatoDinero(p.total) + '</td><td>' + badgeEstado(p.estado) + '</td>' +
                '<td><select class="select-estado">' + opciones + '</select></td>' +
                '<td><button class="btn-green btn-ver-pedido" style="padding:4px 10px; font-size:0.8rem;">TICKET</button></td></tr>';
        }
        if (!filas) {
            filas = '<tr><td colspan="7" class="text-center" style="color: var(--text-muted);">No hay pedidos con este filtro.</td></tr>';
        }
        $('#tablaPedidos tbody').html(filas);
        $('#resumenPedidos').text('Pendientes: ' + pendientes + '  ·  En preparación: ' + preparacion + '  ·  Total de pedidos: ' + lista.length);
    }

    $('#filtroEstado').on('change', dibujarPedidos);
    $('#buscarPedido').on('keyup', dibujarPedidos);

    $(document).on('change', '.select-estado', function(){
        var id = $(this).closest('tr').data('id');
        var nuevo = $(this).val();
        cambiarEstadoPedido(id, nuevo);
        dibujarPedidos();
    });

    $(document).on('click', '.btn-ver-pedido', function(){
        window.location.href = '21_ticket.html?id=' + $(this).closest('tr').data('id');
    });

    // Si un comprador hace un pedido en otra pestaña, se muestra aquí sin recargar
    window.addEventListener('storage', function(e){
        if (e.key === LLAVE_PEDIDOS) dibujarPedidos();
    });

    dibujarPedidos();
});
</script>
</body>
</html>
