<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos - Café Central</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div class="logo-area">
            <i class="fa-solid fa-mug-hot"></i>
            <span>CAFÉ CENTRAL</span>
        </div>
        <button class="nav-toggle" id="navToggle"><i class="fa-solid fa-bars"></i></button>
    </header>

    <main class="app-content">
        <h2 class="text-center mb-4" style="color: var(--primary-brown);">CONTACTO <i class="fa-regular fa-envelope"></i></h2>
        
        <form id="contactForm">
            <div class="form-group">
                <label>Nombre:</label>
                <input type="text" class="form-control" placeholder="Tu nombre completo" required>
            </div>
            <div class="form-group">
                <label>Correo:</label>
                <input type="email" class="form-control" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="form-group">
                <label>Teléfono:</label>
                <input type="tel" class="form-control" placeholder="81 1234 5678">
            </div>
            <div class="form-group">
                <label>Mensaje:</label>
                <textarea class="form-control" rows="4" placeholder="Escribe tu mensaje o sugerencia aquí..." required></textarea>
            </div>
            <button type="submit" class="btn-primary btn-block">ENVIAR MENSAJE →</button>
        </form>

        <div class="text-center mt-4">
            <p style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 10px;">SÍGUENOS EN NUESTRAS REDES</p>
            <div style="display: flex; justify-content: center; gap: 20px; font-size: 1.5rem; color: var(--primary-brown);">
                <a href="#" style="color: inherit;"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" style="color: inherit;"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" style="color: inherit;"><i class="fa-brands fa-tiktok"></i></a>
            </div>
        </div>
    </main>
</div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="js/app.js"></script>
    
    <script>
$(document).ready(function(){
    $('#contactForm').on('submit', function(e){
        e.preventDefault();
        var $f = $(this);
        var datos = {
            nombre: $f.find('input[type="text"]').val().trim(),
            correo: $f.find('input[type="email"]').val().trim(),
            telefono: $f.find('input[type="tel"]').val().trim(),
            mensaje: $f.find('textarea').val().trim()
        };
        var $btn = $f.find('button[type="submit"]').prop('disabled', true);
        api('POST', '/api/contacto', datos)
            .then(function(){
                alert('¡Gracias por tu mensaje! Nos pondremos en contacto contigo pronto.');
                $f[0].reset();
            })
            .catch(mostrarError)
            .then(function(){ $btn.prop('disabled', false); });
    });
});
</script>
</body>
</html>
